<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}Tichu Manager{% endblock %}</title>

    <!-- Open Graph -->
    <meta property="og:title" content="Tichu-Manager">
    <meta property="og:description" content="made by sebalnakji">
    <meta property="og:image" content="https://msgkbhehdqircjpvbptr.supabase.co/storage/v1/object/public/tichu-profiles/og_picture.jpg">
    <meta property="og:url" content="https://agreed-sandie-sebalnakji-c5f65f99.koyeb.app/">
    <meta property="og:type" content="website">

    <!-- 테마 초기화: 깜빡임 방지를 위해 가장 먼저 실행 -->
    <script>
        (function() {
            const theme = localStorage.getItem('tichu_theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <!-- 시즌 목록(최신 시즌이 앞) + 현재 시즌: 서버가 한국 날짜로 계산 -->
    <script>window.TICHU_SEASONS = {{ season_context() | tojson }};</script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/styles.css">

    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 min-h-screen">
    <main class="container mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    {% include 'auth_modal.html' %}

    <script src="/static/js/app.js"></script>
    <script src="/static/js/auth.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
